apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: medicenter-root-ca
  namespace: hospital-system
spec:
  commonName: medicenter-root-ca
  isCA: true
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: medicenter-root-ca-secret
