apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apex-app-cert
  namespace: banking-system
spec:
  dnsNames:
  - apex.local
  - api.apex.local
  - dashboard.apex.local
  - auth.apex.local
  issuerRef:
    name: apex-root-issuer
    kind: Issuer
    group: cert-manager.io
  secretName: apex-app-tls
